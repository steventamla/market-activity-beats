name: Historical Threshold Test

on: 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threshold-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check script syntax
        run: node --check historical-threshold-test.js

      - name: Run historical test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TEST_DAYS: "5"
          MAX_PAIRS: "4"
        run: node historical-threshold-test.js
