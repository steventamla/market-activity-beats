
name: Historical ATR Threshold Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atr-threshold-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check ATR test syntax
        run: node --check historical-atr-threshold-test.js

      - name: Run historical ATR threshold test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TEST_DAYS: "5"
          MAX_PAIRS: "28"
        run: node historical-atr-threshold-test.js
